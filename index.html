 10px;letter-spacing:1px;font-weight:750}.muted{color:var(--muted)}.section{margin:30px 0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.section h2{font-size:16px;letter-spacing:.3px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{background:linear-gradient(140deg,#162331,#101923);border:1px solid var(--stroke);border-radius:18px;padding:22px;min-width:0}.card.accent{background:linear-gradient(120deg,#253447,#101b27);border-color:#496078}.card h2,.card h3{margin:4px 0 12px}.card h2{font-size:21px}.card h3{font-size:16px}.line{border:0;border-top:1px solid var(--stroke);margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.value{font-size:26px;font-weight:800;letter-spacing:-1px}.metricTitle{color:var(--muted);font-size:12px;letter-spacing:.8px;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--stroke);padding:16px;border-radius:14px;background:var(--panel2)}.stat b{display:block;font-size:26px;margin-top:5px}.btn{background:var(--orange);color:#111b25;border:1px solid var(--orange);border-radius:11px;padding:12px 16px;font-weight:800}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#263646;color:var(--ink);border-color:#3b4f62}.btn.ghost{background:transparent;color:var(--muted);border-color:var(--stroke)}.btn.small{font-size:12px;padding:8px 11px}.btn:disabled{opacity:.5;cursor:not-allowed}label{display:block;margin:12px 0 5px;font-size:12px;color:var(--muted);font-weight:700}input,textarea,select{width:100%;color:var(--ink);background:#0a1420;border:1px solid #405063;border-radius:10px;padding:12px 13px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--orange)}textarea{min-height:125px;resize:vertical;line-height:1.5}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.chip{display:inline-flex;border:1px solid #435569;background:#1a2939;color:var(--ink);padding:9px 12px;border-radius:100px;gap:8px;align-items:center;font-size:13px}.chip.chosen{border-color:var(--orange);background:#3b2b24}.hint{color:var(--muted);font-size:12px;line-height:1.55}.item{border-top:1px solid var(--stroke);padding:15px 0}.item:first-child{border-top:0}.item p{white-space:pre-wrap;margin:8px 0;line-height:1.5}.orange{color:var(--orange)}.green{color:var(--green)}.hide{display:none}.mobile{display:none}.empty{border:1px dashed #405365;border-radius:14px;padding:20px;color:var(--muted);text-align:center}.error{color:#ffb3a8}.notice{padding:12px 15px;background:#243546;border:1px solid #405567;border-radius:11px;font-size:12px;color:#c6d4df}.toast{position:fixed;right:20px;bottom:24px;background:#283e51;border:1px solid #65819b;padding:14px 18px;border-radius:12px;box-shadow:0 10px 35px #0008;z-index:10}.weatherGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.weatherGrid .stat b{font-size:20px}@media(max-width:850px){.shell{display:block}.side{display:none}.content{padding:20px 17px 103px}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#101b29;border-top:1px solid var(--stroke);padding:8px 4px max(9px,env(safe-area-inset-bottom));z-index:9}.mobile button{background:transparent;color:var(--muted);border:0;display:grid;gap:4px;justify-items:center;font-size:10px;padding:7px 2px}.mobile button.active{color:var(--orange)}.mobile span{font-size:18px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:13px}.stat b{font-size:20px}.weatherGrid{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.formgrid{grid-template-columns:1fr}.title{margin:10px 0}.topline{margin-bottom:21px}}@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}

.zero-reference b{font-size:22px;color:#ffb074}.formgrid .btn{margin-top:4px}.distance-inline{display:flex;gap:8px;align-items:stretch}.distance-inline input{flex:1;min-width:0}.distance-inline select{flex:0 0 136px;min-width:0}.recorded-settings{border:1px solid #455b6e;border-radius:14px;background:#101e2b;padding:14px;margin:15px 0}.recorded-settings h3{margin:0}@media(max-width:410px){.distance-inline{flex-direction:column}.distance-inline select{width:100%;flex:auto}}.wind-readout{padding:14px;border:1px solid #40546a;border-radius:14px;margin-top:16px}.wind-readout b{font-size:17px}.wind-readout .hint{margin-top:8px}</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="brandMark">EP</div><div>ECHO<br>PRECISION<div class="smallcaps" style="margin-top:5px">Range intelligence</div></div></div><nav id="nav" class="nav"></nav><div class="sidefoot"><b>TEST BUILD 1.1</b><p>Records are saved only in this browser. Export backups regularly.</p><p>Session journal only · No live aiming or turret recommendations.</p></div></aside><main class="content"><div class="topline"><div class="smallcaps">Echo Precision / Field Console</div><span class="pill">● TEST BUILD</span></div><div id="view"></div></main></div><nav class="mobile" id="mobile"></nav><div id="toast" class="toast hide" role="status"></div>
<script>
(function(){
"use strict";
const KEY="echo-precision:demo:v1",tabs=[["dashboard","◈","Dashboard"],["action","◎","In Action"],["quick","◉","Quick Acquire"],["armory","▣","Armory"],["environment","☀","Environment"],["sessions","◷","Sessions"]];
const demo={id:"demo-ar10",name:"AR-10 / .308",caliber:".308 Winchester",scope:"Vortex Viper FFP (example)",ammo:"Federal 150 gr (example)",zero:"50",pinned:true,demo:true};
const seed={rifles:[demo],selectedId:demo.id,sessions:[],activeSessionId:null,weather:null};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed);if(!Array.isArray(db.rifles)||!Array.isArray(db.sessions))db=structuredClone(seed)}catch(e){db=structuredClone(seed)}
let screen="dashboard",profileForm=false,manualForm=false,voice=null,listening=false;
let armoryCategory="rifles",editingProfileId=null,equipmentEditingId=null,equipmentForm=false;
let showDataTools=false,showEventEditor=false,showStageEditor=false,editingEventId=null,editingStageId=null,assistantOpen=false,assistantAnswer="";
let actionDraft={mode:"saved",quickCaliber:"",quickGrains:"",windFrom:"",firingHeading:"",distance:"",distanceUnit:"yd",temperature:"",wind:"",note:"",impactX:"",impactY:"",score:"",possible:"",timer:true,autoVoice:false,newName:"",newCaliber:"",newScope:"",newAmmo:"",newZero:"",opticElevation:"",opticWindage:"",opticUnit:"MOA"};
let actionSummaryId=null,actionWeatherTried=false,actionSpeechBusy=false,actionNewProfile=false,qaExpanded=false,qaLastRunAt=null,weatherSearchQuery="",weatherMessage="";

db.assistantHistory=Array.isArray(db.assistantHistory)?db.assistantHistory:[];
db.events=Array.isArray(db.events)?db.events:[];
db.events.forEach(e=>{e.stages=Array.isArray(e.stages)?e.stages:[]});
db.activeEventId=db.activeEventId||null;db.activeStageId=db.activeStageId||null;
const activeEvent=()=>db.events.find(e=>e.id===db.activeEventId)||null;
const activeStage=()=>activeEvent()?.stages.find(s=>s.id===db.activeStageId)||null;
const stageName=id=>db.events.flatMap(e=>e.stages).find(x=>x.id===id)?.name||"Open practice";
const eventName=id=>db.events.find(e=>e.id===id)?.name||"Practice";
const scoreStats=obs=>{const scored=obs.filter(o=>Number.isFinite(o.score)&&Number.isFinite(o.possible)&&o.possible>0);return {points:scored.reduce((n,o)=>n+o.score,0),possible:scored.reduce((n,o)=>n+o.possible,0),entries:scored.length}};

db.scopes=Array.isArray(db.scopes)?db.scopes:[];
db.loads=Array.isArray(db.loads)?db.loads:[];
db.events=Array.isArray(db.events)?db.events:[];
db.audit=Array.isArray(db.audit)?db.audit:[];
db.preferences=db.preferences&&typeof db.preferences==="object"?db.preferences:{autoWeatherOnStart:false,voiceAfterEvent:false};
db.rifles.forEach(r=>{if(r.scope&&!r.scopeId){let s=db.scopes.find(s=>s.name===r.scope);if(!s){s={id:crypto.randomUUID(),name:r.scope,reticle:"",focalPlane:"",adjustmentUnit:"",notes:"",imported:true};db.scopes.push(s)}r.scopeId=s.id}if(r.ammo&&!r.ammoId){let a=db.loads.find(a=>a.name===r.ammo);if(!a){a={id:crypto.randomUUID(),name:r.ammo,manufacturer:"",weight:"",lot:"",notes:"",imported:true};db.loads.push(a)}r.ammoId=a.id}});
try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){};
const scopeFor=r=>r?(db.scopes.find(x=>x.id===r.scopeId)||null):null;
const loadFor=r=>r?(db.loads.find(x=>x.id===r.ammoId)||null):null;
const scName=r=>scopeFor(r)?.name||r?.scope||"Not set";
const amName=r=>loadFor(r)?.name||r?.ammo||"Not set";
const audit=(action,detail)=>{db.audit.push({at:new Date().toISOString(),action,detail:String(detail||"").slice(0,140)});if(db.audit.length>500)db.audit.shift()};
const val=id=>document.getElementById(id)?.value?.trim()||"";
const safeNum=(v,min,max)=>v===""?true:Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max;
const distFactor={yd:1,m:1/.9144,ft:1/3,km:1000/.9144};
const distLabel={yd:"yd",m:"m",ft:"ft",km:"km"};
const distanceToYards=(value,unit)=>{const x=Number(value),factor=distFactor[unit];return Number.isFinite(x)&&Number.isFinite(factor)?x*factor:NaN};
const distanceFromYards=(yards,unit)=>{const f=distFactor[unit];return Number.isFinite(f)?yards/f:NaN};
const distanceValid=value=>value!==""&&Number.isFinite(Number(value))&&distanceToYards(value,actionDraft.distanceUnit)>0&&distanceToYards(value,actionDraft.distanceUnit)<=100000;
const niceDistance=n=>Number.isFinite(n)?Number(n.toFixed(8)).toString():"";
const distSelector=disabled=>'<select id="distance-unit" '+(disabled?'disabled':'')+'>'+Object.entries({yd:"Yards (yd)",m:"Meters (m)",ft:"Feet (ft)",km:"Kilometers (km)"}).map(([u,l])=>'<option value="'+u+'" '+(actionDraft.distanceUnit===u?'selected':'')+'>'+l+'</option>').join("")+'</select>';


let monitor={active:false,stream:null,context:null,analyser:null,frame:null,last:0,level:0,baseline:.015};
if(!Number.isFinite(db.micThreshold))db.micThreshold=.65;
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>s?new Date(s).toLocaleString():"—";
const num=v=>v==null?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
const rifle=()=>db.rifles.find(r=>r.id===db.selectedId)||db.rifles[0]||null;
const session=()=>db.sessions.find(s=>s.id===db.activeSessionId&&!s.endedAt)||null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Your browser could not save locally. Export your records.")}};
const toast=t=>{const x=el("toast");x.textContent=t;x.classList.remove("hide");setTimeout(()=>x.classList.add("hide"),3400)};
const title=(name,sub)=>'<div class="smallcaps">Precision session management</div><h1 class="title">'+name+'</h1><p class="subtitle">'+sub+'</p>';
const button=(action,label,kind="secondary")=>'<button class="btn '+kind+'" data-action="'+action+'">'+label+'</button>';
const weatherBrief=()=>!db.weather?'<span class="muted">Not loaded — location permission required</span>':num(db.weather.temperature)+'°F · '+num(db.weather.windSpeed)+' mph model wind · '+esc(db.weather.source);
function nav(){el("nav").innerHTML=tabs.map(t=>'<button data-screen="'+t[0]+'" class="'+(screen===t[0]?"active":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join("");el("mobile").innerHTML=tabs.map(t=>'<button data-screen="'+t[0]+'" class="'+(screen===t[0]?"active":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join("")}
function dashboard(){const r=rifle(),pin=db.rifles.filter(r=>r.pinned);return title("Ready when you are.","Your equipment, environmental snapshot, and range journal in one place.")+
'<section class="section"><h2>ACTIVE CONFIGURATION</h2>'+button("go-action","Open In Action →","")+button("go-quick","Quick Acquire","secondary small")+'</section>'+
'<div class="card accent"><div class="row between"><div><div class="smallcaps">SELECTED PROFILE</div><h2>'+esc(r?r.name:"No rifle selected")+'</h2><div class="muted">'+esc(r?r.caliber:"Add a profile in My Armory")+'</div></div><div style="font-size:33px;color:var(--orange)">◎</div></div><hr class="line"><div class="stats"><div class="stat"><span class="metricTitle">Scope</span><b style="font-size:13px">'+esc(r?scName(r):"—")+'</b></div><div class="stat"><span class="metricTitle">Ammunition</span><b style="font-size:13px">'+esc(r?amName(r):"—")+'</b></div><div class="stat"><span class="metricTitle">Saved zero</span><b>'+esc(r?r.zero||"—":"—")+'<small style="font-size:11px"> yd</small></b></div></div>'+(r&&r.demo?'<p class="hint">Example profile only. Verify all details before using or replace it with your own.</p>':"")+'</div>'+
'<section class="section"><h2>QUICK SELECT</h2>'+button("go-armory","Manage →","ghost small")+'</section><div class="row">'+(pin.length?pin.map(x=>'<button data-select="'+esc(x.id)+'" class="chip '+(r&&r.id===x.id?"chosen":"")+'">'+(r&&r.id===x.id?"● ":"○ ")+esc(x.name)+'</button>').join(""):'<div class="empty">Pin profiles in your Armory to see them here.</div>')+'</div>'+
'<section class="section"><h2>ENVIRONMENT SNAPSHOT</h2>'+button("go-environment","Conditions →","ghost small")+'</section><div class="card"><div class="row between"><div>'+weatherBrief()+'</div><span class="pill">ESTIMATE</span></div><p class="hint">Forecast/model wind is not a measured reading at your exact location. Check source, time and local conditions.</p></div>'+
'<section class="section"><h2>YOUR JOURNAL</h2></section><div class="stats"><div class="stat"><span class="metricTitle">Profiles</span><b>'+db.rifles.length+'</b></div><div class="stat"><span class="metricTitle">Sessions</span><b>'+db.sessions.length+'</b></div><div class="stat"><span class="metricTitle">Observations</span><b>'+db.sessions.reduce((n,s)=>n+s.observations.length,0)+'</b></div></div>'}

function compassBearing(v){
 if(v===null||v===undefined||v===""||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>360)return null;
 const d=((Number(v)%360)+360)%360,points=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
 return {degree:d,direction:points[Math.round(d/22.5)%16]}
}
function windBearingDescription(w){
 const bearing=compassBearing(w?.windDirection);
 if(!bearing)return "Wind origin not recorded";
 const dest=compassBearing((bearing.degree+180)%360);
 return "Wind FROM "+bearing.direction+" ("+num(bearing.degree)+"°) → toward "+dest.direction+" ("+num(dest.degree)+"°)"
}
function quickAcquire(){
 const w=db.weather,condition=conditionStatus(w),wind=actionDraft.windFrom===""?w?.windDirection:actionDraft.windFrom,from=compassBearing(wind),toward=from?compassBearing((from.degree+180)%360):null,heading=compassBearing(actionDraft.firingHeading);
 return title("Quick Acquire.","Quick weather, equipment references and practice-session setup.")+
 '<div class="notice">Weather bearings and firearm headings are recorded for reference. No MOA click counts, firing solutions, aiming points or follow-up adjustments are generated.</div>'+
 '<div class="card"><div class="row between"><h3>01 · Quick reference</h3><span class="pill">JOURNAL</span></div><div class="formgrid">'+
 '<div><label>Caliber</label><input id="action-quick-caliber" placeholder=".308 Winchester" value="'+esc(actionDraft.quickCaliber)+'"></div>'+
 '<div><label>Projectile weight (grains)</label><input id="action-quick-grains" type="number" step="any" min="1" max="1500" placeholder="Optional" value="'+esc(actionDraft.quickGrains)+'"></div>'+
 '<div><label>Distance</label><div class="distance-inline"><input id="action-quick-distance" type="number" min="0" max="100000" step="any" placeholder="e.g. 400" value="'+esc(actionDraft.distance)+'">'+distSelector(false)+'</div></div>'+
 '<div><label>Wind speed (mph)</label><input id="action-quick-wind" type="number" min="0" max="250" step="any" placeholder="'+esc(w?.windSpeed==null?"Optional":num(w.windSpeed)+" estimated")+'" value="'+esc(actionDraft.wind)+'"></div>'+
 '<div><label>Wind FROM bearing (degrees)</label><input id="quick-wind-from" type="number" min="0" max="360" step="any" placeholder="'+esc(w?.windDirection==null?"Optional":num(w.windDirection)+" from forecast")+'" value="'+esc(actionDraft.windFrom)+'"></div>'+
 '<div><label>Facing heading (degrees from North)</label><input id="quick-heading" type="number" min="0" max="360" step="any" placeholder="e.g. 180 = South" value="'+esc(actionDraft.firingHeading)+'"></div></div>'+
 '<div class="wind-readout"><div class="smallcaps">DIRECTION REFERENCE</div><b>'+esc(from?"Wind FROM "+from.direction+" → toward "+toward.direction:"Wind direction not recorded")+'</b><p class="hint">'+esc(heading?"Facing "+heading.direction+" ("+num(heading.degree)+"°)":"Facing heading not recorded")+'</p><p class="hint">Forecast wind bearings identify where the wind comes FROM; these are contextual readings only.</p></div>'+
 '<div class="row" style="margin-top:16px">'+button("quick-open-journal","Continue to In Action log","")+' '+button("go-armory","Rifle configuration","ghost small")+'</div></div>'+
 '<div class="card"><div class="row between"><h3>02 · Current environment</h3><span class="pill">'+esc(condition.label)+'</span></div>'+

function summaryPanel(s){

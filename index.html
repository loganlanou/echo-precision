/* ---- Sight in a rifle: pick rifle → turret click value → distance → shoot groups → clicks → save zero ---- */
const SI_CLICKS={MOA:[[0.125,"1/8 MOA"],[0.25,"1/4 MOA"],[0.5,"1/2 MOA"],[1,"1 MOA"]],MIL:[[0.05,"0.05 MIL"],[0.1,"0.1 MIL"],[0.2,"0.2 MIL"]]};

function siDefaults(){return {step:"rifle",rifleId:"",unit:"",click:"",dist:"100",distUnit:"yd",per:3,tR:0,groups:[],cur:[],startedAt:new Date().toISOString()}}
function siS(){if(!db.sightIn||!Array.isArray(db.sightIn.groups)||!Array.isArray(db.sightIn.cur))db.sightIn=siDefaults();return db.sightIn}
const siRifle=()=>db.rifles.find(r=>r.id===siS().rifleId)||null;
function siYd(){const s=siS(),d=Number(s.dist);return d>0?(s.distUnit==="m"?d*1.0936133:d):0}
const siUnitIn=()=>(siS().unit==="MIL"?3.6:1.047197551)*siYd()/100;
const siClickIn=()=>siUnitIn()*Number(siS().click);
const siClickOK=()=>{const s=siS();return (s.unit==="MOA"||s.unit==="MIL")&&Number(s.click)>0&&Number(s.click)<=5};
const siF=v=>{const r=Math.round(Math.abs(v)*10)/10;return (r%1?r.toFixed(1):String(r))+"″"};
const siClickName=()=>{const s=siS(),k=(SI_CLICKS[s.unit]||[]).find(c=>c[0]===Number(s.click));return k?k[1]:s.click+" "+s.unit};
const siDistName=()=>{const s=siS();return Number(s.dist)+" "+(s.distUnit==="m"?"m":"yd")};
const siWhere=(x,y)=>{const a=[];if(Math.abs(y)>=0.05)a.push(siF(y)+(y>0?" high":" low"));if(Math.abs(x)>=0.05)a.push(siF(x)+(x>0?" right":" left"));return a.length?a.join(", "):"dead center"};
function siCenter(shots){const n=shots.length;if(!n)return null;const x=shots.reduce((a,p)=>a+p.x,0)/n,y=shots.reduce((a,p)=>a+p.y,0)/n;let es=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)es=Math.max(es,Math.hypot(shots[i].x-shots[j].x,shots[i].y-shots[j].y));return {x,y,es}}
/* Group center → clicks. Low → come up, left → come right. Within 0.3 MOA / 0.1 MIL (or half a click) on both axes counts as zeroed. */
function siCorrection(c){const s=siS(),ci=siClickIn(),tol=Math.max((s.unit==="MIL"?0.1:0.3)*siUnitIn(),ci/2);
 return {e:Math.round(-c.y/ci)||0,w:Math.round(-c.x/ci)||0,zeroed:Math.abs(c.x)<=tol&&Math.abs(c.y)<=tol}}

 const u=String(c.unit||"in").toLowerCase(),k=u==="moa"?1.047197551*siYd()/100:u==="mil"?3.6*siYd()/100:u==="cm"?1/2.54:1;return {x:Math.round(c.x*k*100)/100,y:Math.round(c.y*k*100)/100}}

function compassBearing(v){
 if(v===null||v===undefined||v===""||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>360)return null;
 const d=((Number(v)%360)+360)%360,points=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
 return {degree:d,direction:points[Math.round(d/22.5)%16]}
}
function windBearingDescription(w){
 const bearing=compassBearing(w?.windDirection);
 if(!bearing)return "Wind origin not recorded";
 const dest=compassBearing((bearing.degree+180)%360);
 return "Wind FROM "+bearing.direction+" ("+num(bearing.degree)+"°) → toward "+dest.direction+" ("+num(dest.degree)+"°)"
}

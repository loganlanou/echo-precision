<script>
(function(){
"use strict";
const KEY="echo-precision:demo:v1",tabs=[["dashboard","◈","Dashboard"],["action","◎","In Action"],["quick","◉","Quick Acquire"],["ballistics","◬","Ballistics"],["armory","▣","Armory"],["environment","☀","Environment"],["sessions","◷","Sessions"]];
const demo={id:"demo-ar10",name:"AR-10 / .308",caliber:".308 Winchester",scope:"Vortex Viper FFP (example)",ammo:"Federal 150 gr (example)",zero:"50",pinned:true,demo:true};
const seed={rifles:[demo],selectedId:demo.id,sessions:[],activeSessionId:null,weather:null};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed);if(!Array.isArray(db.rifles)||!Array.isArray(db.sessions))db=structuredClone(seed)}catch(e){db=structuredClone(seed)}
let screen="dashboard",profileForm=false,manualForm=false,voice=null,listening=false;
let armoryCategory="rifles",editingProfileId=null,equipmentEditingId=null,equipmentForm=false;
let showDataTools=false,showEventEditor=false,showStageEditor=false,editingEventId=null,editingStageId=null,assistantOpen=false,assistantAnswer="";
let actionDraft={mode:"saved",quickCaliber:"",quickGrains:"",windFrom:"",firingHeading:"",distance:"",distanceUnit:"yd",temperature:"",wind:"",note:"",impactX:"",impactY:"",score:"",possible:"",timer:true,autoVoice:false,newName:"",newCaliber:"",newScope:"",newAmmo:"",newZero:"",opticElevation:"",opticWindage:"",opticUnit:"MOA",quickMv:"",quickBc:"",quickDrag:"G1",quickZero:"100",quickSight:"1.5",spotterCall:""};
let actionSummaryId=null,actionWeatherTried=false,actionSpeechBusy=false,actionNewProfile=false,qaExpanded=false,qaLastRunAt=null,weatherSearchQuery="",weatherMessage="";

db.assistantHistory=Array.isArray(db.assistantHistory)?db.assistantHistory:[];
db.events=Array.isArray(db.events)?db.events:[];
db.events.forEach(e=>{e.stages=Array.isArray(e.stages)?e.stages:[]});
db.activeEventId=db.activeEventId||null;db.activeStageId=db.activeStageId||null;
const activeEvent=()=>db.events.find(e=>e.id===db.activeEventId)||null;
const activeStage=()=>activeEvent()?.stages.find(s=>s.id===db.activeStageId)||null;
const stageName=id=>db.events.flatMap(e=>e.stages).find(x=>x.id===id)?.name||"Open practice";
const eventName=id=>db.events.find(e=>e.id===id)?.name||"Practice";
const scoreStats=obs=>{const scored=obs.filter(o=>Number.isFinite(o.score)&&Number.isFinite(o.possible)&&o.possible>0);return {points:scored.reduce((n,o)=>n+o.score,0),possible:scored.reduce((n,o)=>n+o.possible,0),entries:scored.length}};

db.scopes=Array.isArray(db.scopes)?db.scopes:[];
db.loads=Array.isArray(db.loads)?db.loads:[];
db.events=Array.isArray(db.events)?db.events:[];
db.audit=Array.isArray(db.audit)?db.audit:[];
db.preferences=db.preferences&&typeof db.preferences==="object"?db.preferences:{autoWeatherOnStart:false,voiceAfterEvent:false};
db.rifles.forEach(r=>{if(r.scope&&!r.scopeId){let s=db.scopes.find(s=>s.name===r.scope);if(!s){s={id:crypto.randomUUID(),name:r.scope,reticle:"",focalPlane:"",adjustmentUnit:"",notes:"",imported:true};db.scopes.push(s)}r.scopeId=s.id}if(r.ammo&&!r.ammoId){let a=db.loads.find(a=>a.name===r.ammo);if(!a){a={id:crypto.randomUUID(),name:r.ammo,manufacturer:"",weight:"",lot:"",notes:"",imported:true};db.loads.push(a)}r.ammoId=a.id}});
try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){};
const scopeFor=r=>r?(db.scopes.find(x=>x.id===r.scopeId)||null):null;
const loadFor=r=>r?(db.loads.find(x=>x.id===r.ammoId)||null):null;
const scName=r=>scopeFor(r)?.name||r?.scope||"Not set";
const amName=r=>loadFor(r)?.name||r?.ammo||"Not set";
const audit=(action,detail)=>{db.audit.push({at:new Date().toISOString(),action,detail:String(detail||"").slice(0,140)});if(db.audit.length>500)db.audit.shift()};
const val=id=>document.getElementById(id)?.value?.trim()||"";
const safeNum=(v,min,max)=>v===""?true:Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max;
const distFactor={yd:1,m:1/.9144,ft:1/3,km:1000/.9144};
const distLabel={yd:"yd",m:"m",ft:"ft",km:"km"};
const distanceToYards=(value,unit)=>{const x=Number(value),factor=distFactor[unit];return Number.isFinite(x)&&Number.isFinite(factor)?x*factor:NaN};
const distanceFromYards=(yards,unit)=>{const f=distFactor[unit];return Number.isFinite(f)?yards/f:NaN};
const distanceValid=value=>value!==""&&Number.isFinite(Number(value))&&distanceToYards(value,actionDraft.distanceUnit)>0&&distanceToYards(value,actionDraft.distanceUnit)<=100000;
const niceDistance=n=>Number.isFinite(n)?Number(n.toFixed(8)).toString():"";
const distSelector=disabled=>'<select id="distance-unit" '+(disabled?'disabled':'')+'>'+Object.entries({yd:"Yards (yd)",m:"Meters (m)",ft:"Feet (ft)",km:"Kilometers (km)"}).map(([u,l])=>'<option value="'+u+'" '+(actionDraft.distanceUnit===u?'selected':'')+'>'+l+'</option>').join("")+'</select>';


let monitor={active:false,stream:null,context:null,analyser:null,frame:null,last:0,level:0,baseline:.015};
if(!Number.isFinite(db.micThreshold))db.micThreshold=.65;
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>s?new Date(s).toLocaleString():"—";
const num=v=>v==null?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
const rifle=()=>db.rifles.find(r=>r.id===db.selectedId)||db.rifles[0]||null;
const session=()=>db.sessions.find(s=>s.id===db.activeSessionId&&!s.endedAt)||null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Your browser could not save locally. Export your records.")}};
const toast=t=>{const x=el("toast");x.textContent=t;x.classList.remove("hide");setTimeout(()=>x.classList.add("hide"),3400)};
const title=(name,sub)=>'<div class="smallcaps">Precision session management</div><h1 class="title">'+name+'</h1><p class="subtitle">'+sub+'</p>';
const button=(action,label,kind="secondary")=>'<button class="btn '+kind+'" data-action="'+action+'">'+label+'</button>';
const weatherBrief=()=>!db.weather?'<span class="muted">Not loaded — location permission required</span>':num(db.weather.temperature)+'°F · '+num(db.weather.windSpeed)+' mph model wind · '+esc(db.weather.source);
/* ---------- Ballistic calculator integration ---------- */
const EB=window.EchoBallistics||null;
db.calc=Object.assign({angle:"",latitude:"",unit:"",clickValue:"",step:"100",maxRange:"1000",envTemp:"",envPressure:"",envHumidity:"",envAltitude:"",spin:true,coriolis:true,truingRange:"",truingDial:""},db.calc&&typeof db.calc==="object"?db.calc:{});
db.preferences.speakCorrections=db.preferences.speakCorrections!==false;
let trueVelocityResult=null;
const fx=(v,d=1)=>Number.isFinite(v)?v.toFixed(d):"—";
const blankish=v=>v===""||v==null||(typeof v==="number"&&!Number.isFinite(v));
function currentBallisticProfile(){
 if(actionDraft.mode==="quick")return {label:"Quick load · "+(actionDraft.quickCaliber.trim()||"custom"),quick:true,muzzleVelocityFps:actionDraft.quickMv,ballisticCoefficient:actionDraft.quickBc,dragModel:actionDraft.quickDrag||"G1",weightGr:actionDraft.quickGrains,sightHeightIn:actionDraft.quickSight||"1.5",zeroYd:actionDraft.quickZero||"100",twist:"",twistDirection:"right",diameterIn:"",lengthIn:"",adjustmentUnit:"",clickValue:""};
 const r=rifle();if(!r)return null;const sc=scopeFor(r),ld=loadFor(r);
 return {label:r.name,quick:false,rifleId:r.id,muzzleVelocityFps:r.muzzleVelocityFps||"",ballisticCoefficient:r.ballisticCoefficient||"",dragModel:r.dragModel||"G1",weightGr:r.projectileGrains||ld?.weight||"",sightHeightIn:r.sightHeightIn||"1.5",zeroYd:r.zero||"100",twist:r.twist||"",twistDirection:r.twistDirection||"right",diameterIn:r.bulletDiameterIn||"",lengthIn:r.bulletLengthIn||"",adjustmentUnit:sc?.adjustmentUnit||"",clickValue:sc?.clickValue||""};
}
function ballisticProfile(){const s=session();return s?.ballisticProfile||currentBallisticProfile()}
function shotConditions(){
 const s=session(),w=s?.weather||db.weather||{},c=db.calc;
 const pick=(a,b)=>!blankish(a)&&Number.isFinite(Number(a))?Number(a):(blankish(b)?"":Number(b));
 const range=distanceValid(actionDraft.distance)?distanceToYards(actionDraft.distance,actionDraft.distanceUnit):(Number.isFinite(s?.distance)?s.distance:NaN);
 const heading=actionDraft.firingHeading!==""?Number(actionDraft.firingHeading):(s?.fieldContext?.facingHeadingDegrees??"");
 return {rangeYd:range,windMph:pick(actionDraft.wind,w.windSpeed),windFromDeg:pick(actionDraft.windFrom,w.windDirection),headingDeg:heading,angleDeg:c.angle,latitudeDeg:pick(c.latitude,w.latitude),
  env:{temperatureF:pick(c.envTemp,w.temperature),pressureHpa:pick(c.envPressure,w.pressure),humidity:pick(c.envHumidity,w.humidity),altitudeM:pick(c.envAltitude,w.altitudeMeters)}};
}
function solutionUnit(p){const u=String(db.calc.unit||p?.adjustmentUnit||"MOA").toUpperCase();return u==="MIL"?"MIL":"MOA"}
function computeSolution(overrides){
 if(!EB)return {ok:false,errors:["Ballistic engine failed to load. Refresh the page."]};
 const p=ballisticProfile();if(!p)return {ok:false,errors:["Select or create a rifle profile first."]};
 const missing=[];if(!(Number(p.muzzleVelocityFps)>0))missing.push("muzzle velocity");if(!(Number(p.ballisticCoefficient)>0))missing.push("ballistic coefficient");
 if(missing.length)return {ok:false,profile:p,errors:["Add "+missing.join(" and ")+" to "+(p.quick?"the quick load":"“"+p.label+"”")+" to compute a firing solution."]};
 const c=Object.assign(shotConditions(),overrides||{}),u=solutionUnit(p),step=Math.max(25,Number(db.calc.step)||100),maxR=Math.min(5000,Math.max(step,Number(db.calc.maxRange)||1000,Number.isFinite(c.rangeYd)?c.rangeYd:0));
 const r=EB.solve({muzzleVelocityFps:p.muzzleVelocityFps,ballisticCoefficient:p.ballisticCoefficient,dragModel:p.dragModel,weightGr:p.weightGr,sightHeightIn:p.sightHeightIn,zeroYd:p.zeroYd,twist:p.twist,twistDirection:p.twistDirection,diameterIn:p.diameterIn,lengthIn:p.lengthIn,
  rangeYd:c.rangeYd,windMph:c.windMph,windFromDeg:c.windFromDeg,headingDeg:c.headingDeg,angleDeg:c.angleDeg,latitudeDeg:c.latitudeDeg,env:c.env,clickUnit:u,clickValue:db.calc.clickValue||p.clickValue,
  spinDrift:db.calc.spin!==false,coriolis:db.calc.coriolis!==false,stepYd:step,maxRangeYd:maxR});
 r.profile=p;r.conditions=c;r.unit=u;r.headingMissing=c.headingDeg===""&&c.windFromDeg!==""&&Number(c.windMph)>0;return r;
}
const dialDec=u=>u==="MIL"?1:2;
function dialWords(row,u){const e=u==="MIL"?row.elevMIL:row.elevMOA,w=u==="MIL"?row.windMIL:row.windMOA,d=dialDec(u),z=.5*Math.pow(10,-d);

function solutionWarnings(r){const out=[],t=r.target;

 if(t&&t.mach<1.2)out.push("Bullet is "+(t.mach<1?"subsonic":"transonic")+" at this range (Mach "+fx(t.mach,2)+"). Predictions are less reliable; true your data at distance.");
